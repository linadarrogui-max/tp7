<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="top-buttons">
            <button id="signupPageBtn">S'inscrire</button>
            <button id="signinPageBtn">Se connecter</button>
        </div>

        <!-- PAGE SIGN UP -->
        <div id="signupPage">

            <h1>S'inscrire</h1>

            <input type="text" id="signupName" placeholder="Nom">

            <input type="email" id="signupEmail" placeholder="Email">

            <input type="password" id="signupPassword" placeholder="Mot de passe">

            <button id="signupBtn">Créer un compte</button>

        </div>

        <!-- PAGE SIGN IN -->
        <div id="signinPage">

            <h1>Se connecter</h1>

            <input type="email" id="signinEmail" placeholder="Email">

            <input type="password" id="signinPassword" placeholder="Mot de passe">

            <button id="signinBtn">Connexion</button>

        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
